{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Provinsi Indonesia</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        header {
            height: 54px;
            padding: 8px 18px;
            background: #0b4f6c;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        header small {
            display: block;
            font-size: 12px;
            opacity: 0.85;
            color: #d1ecf1;
        }

        .wadah {
            display: flex;
            height: calc(100vh - 54px);
        }

        #panel {
            width: 290px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #ddd;
            background: #fdfdfd;
        }

        #cari {
            margin: 10px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        #cari:focus {
            border-color: #0b4f6c;
            box-shadow: 0 0 0 2px rgba(11, 79, 108, 0.2);
        }

        #daftar {
            flex: 1;
            overflow-y: auto;
        }

        #map {
            flex: 1;
        }

        /* Hilangkan bug box outline hitam bawaan browser saat poligon diklik */
        path,
        path:focus,
        path:focus-visible,
        path.leaflet-interactive,
        path.leaflet-interactive:focus,
        path.leaflet-interactive:focus-visible,
        svg,
        svg:focus,
        .leaflet-container,
        .leaflet-container:focus,
        .leaflet-interactive,
        .leaflet-interactive:focus {
            outline: none !important;
            box-shadow: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        .item {
            padding: 9px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            transition: background 0.15s, border-left 0.15s;
        }

        .item:hover {
            background: #e9f4f8;
        }

        .item.aktif {
            background: #fbebee;
            border-left: 4px solid #d1495b;
            font-weight: 600;
            color: #8b1e2e;
        }

        .item .kode {
            display: inline-block;
            min-width: 28px;
            margin-right: 8px;
            padding: 2px 5px;
            border-radius: 4px;
            background: #0b4f6c;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
        }

        .item.aktif .kode {
            background: #d1495b;
        }

        .pesan {
            padding: 16px;
            font-size: 13px;
            color: #555;
            text-align: center;
        }

        .pesan.error {
            color: #b00020;
        }

        @media (max-width: 768px) {
            .wadah {
                flex-direction: column;
            }

            #panel {
                width: 100%;
                height: 38%;
                border-right: 0;
                border-bottom: 1px solid #ddd;
            }
        }
    </style>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
    <header>
        <div>
            <h1>Peta Provinsi Indonesia</h1>
            <small id="status">Memuat data batas wilayah...</small>
        </div>
    </header>

    <div class="wadah">
        <div id="panel">
            <input id="cari" type="search" placeholder="Cari nama provinsi...">
            <div id="daftar">
                <div class="pesan">Memuat daftar provinsi...</div>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script>
        const URL_GEOJSON = "{% static 'json/indonesia_provinsi.geojson' %}";

        // Inisialisasi peta di pusat Indonesia
        const map = L.map("map", { minZoom: 4 }).setView([-2.5, 118], 5);

        // Basemap OpenStreetMap
        const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Basemap Citra Satelit Esri
        const satelit = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            { maxZoom: 19, attribution: "Tiles &copy; Esri" }
        );

        // Layer grup untuk batas wilayah dan marker
        const lapisanBatas = L.featureGroup().addTo(map);
        const lapisanMarker = L.featureGroup().addTo(map);

        L.control.layers(
            { "OpenStreetMap": osm, "Citra Satelit": satelit },
            { "Batas Wilayah Provinsi": lapisanBatas, "Titik Marker": lapisanMarker },
            { position: 'topright' }
        ).addTo(map);

        L.control.scale({ imperial: false }).addTo(map);

        function aman(teks) {
            const div = document.createElement("div");
            div.textContent = teks ?? "";
            return div.innerHTML;
        }

        // Gaya default batas provinsi (menetap dari awal)
        const gayaDefault = {
            color: "#2a5d84",
            weight: 1.4,
            opacity: 0.85,
            fillColor: "#4a90e2",
            fillOpacity: 0.12
        };

        // Gaya saat mouse melayang (hover)
        const gayaHover = {
            color: "#d1495b",
            weight: 2.2,
            opacity: 1,
            fillColor: "#d1495b",
            fillOpacity: 0.28
        };

        // Gaya saat provinsi aktif/dipilih
        const gayaAktif = {
            color: "#d1495b",
            weight: 3,
            opacity: 1,
            fillColor: "#d1495b",
            fillOpacity: 0.42
        };

        let layerAktif = null;
        let itemAktif = null;
        const layerPeta = {};
        const itemDaftar = {};

        // Fungsi memilih & meng-highlight provinsi secara instan
        function pilihProvinsi(id, zoomPeta = true) {
            const layer = layerPeta[id];
            const item = itemDaftar[id];
            if (!layer || !item) return;

            const p = layer.feature.properties;
            const status = document.getElementById("status");

            // Reset layer sebelumnya
            if (layerAktif && layerAktif !== layer) {
                layerAktif.setStyle(gayaDefault);
            }
            if (itemAktif) {
                itemAktif.classList.remove("aktif");
            }

            // Set aktif yang baru
            layer.setStyle(gayaAktif);
            layer.bringToFront();
            layerAktif = layer;

            item.classList.add("aktif");
            itemAktif = item;
            item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            status.textContent = `Provinsi terpilih: ${p.name} (Kode: ${p.id})`;

            // Otomatis menengahkan peta tepat di tengah batas wilayah provinsi
            if (zoomPeta) {
                map.fitBounds(layer.getBounds(), {
                    padding: [40, 40],
                    maxZoom: 7,
                    animate: true,
                    duration: 0.6
                });
            }

            // Buka popup info tanpa menggeser peta
            if (layer._popup) {
                layer.openPopup();
            }
        }

        // Muat seluruh batas GeoJSON provinsi dari awal
        async function muatPetaDanDaftar() {
            const status = document.getElementById("status");
            const daftar = document.getElementById("daftar");

            try {
                const respon = await fetch(URL_GEOJSON);
                if (!respon.ok) throw new Error(`HTTP ${respon.status}`);
                const dataGeoJSON = await respon.json();

                daftar.innerHTML = "";

                // Urutkan provinsi berdasarkan ID
                dataGeoJSON.features.sort((a, b) => parseInt(a.properties.id) - parseInt(b.properties.id));

                // 1. Gambar seluruh batas poligon langsung di peta
                L.geoJSON(dataGeoJSON, {
                    style: gayaDefault,
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties;
                        layerPeta[p.id] = layer;

                        // Tooltip saat kursor diarahkan ke poligon
                        layer.bindTooltip(`<b>${aman(p.name)}</b>`, { sticky: true });

                        // Popup info
                        layer.bindPopup(`
                            <div style="font-size: 13px; line-height: 1.5;">
                                <b style="color: #0b4f6c; font-size: 15px;">${aman(p.name)}</b><br>
                                <span>Kode Wilayah: <b>${aman(p.id)}</b></span><br>
                                <span style="color: #666; font-size: 12px;">Koordinat Pusat: ${Number(p.latitude).toFixed(4)}, ${Number(p.longitude).toFixed(4)}</span>
                            </div>
                        `, { autoPan: false });

                        // Event mouse pada poligon
                        layer.on("mouseover", function () {
                            if (layerAktif !== layer) {
                                layer.setStyle(gayaHover);
                            }
                        });

                        layer.on("mouseout", function () {
                            if (layerAktif !== layer) {
                                layer.setStyle(gayaDefault);
                            }
                        });

                        layer.on("click", function () {
                            pilihProvinsi(p.id, true);
                        });

                        // Tambahkan juga titik marker ke lapisan marker
                        if (p.latitude && p.longitude) {
                            const marker = L.marker([p.latitude, p.longitude], { title: p.name });
                            marker.bindPopup(`
                                <div style="font-size: 13px; line-height: 1.5;">
                                    <b style="color: #0b4f6c; font-size: 15px;">${aman(p.name)}</b><br>
                                    <span>Kode Wilayah: <b>${aman(p.id)}</b></span><br>
                                    <span style="color: #666; font-size: 12px;">Koordinat: ${Number(p.latitude).toFixed(4)}, ${Number(p.longitude).toFixed(4)}</span>
                                </div>
                            `, { autoPan: false });
                            marker.on("click", function () {
                                pilihProvinsi(p.id, true);
                            });
                            marker.addTo(lapisanMarker);
                        }

                        // 2. Buat item di daftar sidebar
                        const item = document.createElement("div");
                        item.className = "item";
                        item.dataset.nama = p.name.toLowerCase();
                        item.innerHTML = `<span class="kode">${aman(p.id)}</span><span>${aman(p.name)}</span>`;
                        item.onclick = function () {
                            pilihProvinsi(p.id, true);
                        };

                        daftar.appendChild(item);
                        itemDaftar[p.id] = item;
                    }
                }).addTo(lapisanBatas);

                map.fitBounds(lapisanBatas.getBounds(), { padding: [20, 20] });
                status.textContent = `${dataGeoJSON.features.length} batas provinsi siap ditampilkan`;

            } catch (err) {
                console.error(err);
                status.textContent = "Gagal memuat batas wilayah";
                daftar.innerHTML = `
                    <div class="pesan error">
                        Gagal memuat file GeoJSON (${aman(err.message)}).<br>
                        Pastikan server Django aktif.
                    </div>
                `;
            }
        }

        // Pencarian real-time di sidebar
        document.getElementById("cari").addEventListener("input", (e) => {
            const kata = e.target.value.toLowerCase().trim();
            document.querySelectorAll("#daftar .item").forEach((item) => {
                const cocok = item.dataset.nama.includes(kata) || item.innerText.toLowerCase().includes(kata);
                item.style.display = cocok ? "flex" : "none";
            });
        });

        // Jalankan
        muatPetaDanDaftar();
    </script>
</body>

</html>
